name: prakash pipeline

on:
  workflow_dispatch:

jobs:
  job:
    runs-on: ubuntu-latest
    steps:
      - name: PUBLIC repositors
        uses: GuillaumeFalourd/clone-github-repo-action@v2.1
        with:
          depth: 1
          branch: 'main'
          owner: 'sudarsanchakri123'
          repository: 'develop-the-app'

       - name: List my repo files
        run: ls -R

      - name: Move into cloned repo
        run: |
          cd develop-the-app   # move into the cloned repo
          ls -l                # list files inside
