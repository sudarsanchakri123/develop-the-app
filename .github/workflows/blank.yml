name: prakash  pipeline432

on:
  push:
      branches:
          -main

jobs:
  build_and_push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout my repo
        uses: actions/checkout@v4

      - name: Clone another public repo
        uses: GuillaumeFalourd/clone-github-repo-action@v2.1
        with:
          depth: 1
          branch: 'main'
          owner: 'sudarsanchakri123'
          repository: 'develop-the-app'

      - name: List my repo files
        run: ls -R

      - name: Move into cloned repo and list files
        run: |
          cd develop-the-app
          ls -R

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: sudarsanchakri123
          password: ${{ secrets.dockerhub }}

      - name: Build Docker image
        run: docker build -t developimage:image .
